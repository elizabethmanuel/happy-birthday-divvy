<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy Birthday Divvy!</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="hero">
  <p class="eyebrow">A celebration for</p>
  <h1>Divvy's 19th Birthday</h1>
  <p class="tagline">A little something from all of us who love you.</p>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-tab="main">Home</button>
  <button class="tab-btn" data-tab="videos">Videos</button>
  <button class="tab-btn" data-tab="letters">Letters</button>
</nav>

<main>

  <!-- MAIN TAB -->
  <section id="main" class="tab-content active">
    <div class="card">
      <h2>Wishing you the happiest of birthdays!</h2>
      <p>
        We love you so much!
      </p>
    </div>
    <div class="photo-grid" id="photo-grid">
      <!-- Photos are generated from script.js -->
    </div>
  </section>

  <!-- VIDEOS TAB -->
  <section id="videos" class="tab-content">
    <h2>Videos from the fam!</h2>
    <div class="spotlight" id="video-spotlight">
      <!-- Spotlight video is generated from script.js -->
    </div>
    <div class="carousel-wrap">
      <button class="carousel-arrow left" id="video-carousel-left" aria-label="Previous">&#8249;</button>
      <div class="carousel video-carousel" id="video-grid">
        <!-- Thumbnail cards are generated from script.js -->
      </div>
      <button class="carousel-arrow right" id="video-carousel-right" aria-label="Next">&#8250;</button>
    </div>
  </section>

  <!-- LETTERS TAB -->
  <section id="letters" class="tab-content">
    <h2>Letters from Friends</h2>
    <div class="carousel-wrap">
      <button class="carousel-arrow left" id="carousel-left" aria-label="Previous">&#8249;</button>
      <div class="carousel" id="letter-carousel">
        <!-- Letter cards are generated from script.js -->
      </div>
      <button class="carousel-arrow right" id="carousel-right" aria-label="Next">&#8250;</button>
    </div>
    <p class="closing-line">Happy 19th!</p>
  </section>

</main>

<!-- Letter modal -->
<div class="modal-overlay" id="letter-modal">
  <div class="modal">
    <button class="modal-close" id="modal-close">&times;</button>
    <h3 id="modal-from"></h3>
    <p id="modal-body"></p>
  </div>
</div>

<!-- Photo lightbox -->
<div class="modal-overlay" id="photo-modal">
  <div class="modal photo-modal">
    <button class="modal-close" id="photo-modal-close">&times;</button>
    <img id="photo-modal-img" src="" alt="" />
  </div>
</div>

<footer>
  <p>Made with love for Divvy's birthday ❤️</p>
</footer>

<script src="script.js"></script>
</body>
</html>
